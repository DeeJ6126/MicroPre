  <style>
:root {
  --bg: #f7f8fa; --surface: #ffffff; --surface-warm: #faf7f5;
  --fg: #1a3a4a; --fg-2: #2a4a5a; --muted: #5a6a7a; --meta: #7a8a9a;
  --accent: #3a8c6f; --accent-on: #ffffff;
  --accent-hover: color-mix(in oklab, #3a8c6f, black 8%);
  --accent-active: color-mix(in oklab, #3a8c6f, black 14%);
  --highlight: #c17f3b; --highlight-soft: rgba(193,127,59,0.15);
  --accent-soft: rgba(58,140,111,0.12);
  --accent-glow: rgba(58,140,111,0.20);
  --accent-glow-strong: rgba(58,140,111,0.35);
  --deep-blue-soft: rgba(26,58,74,0.06);
  --deep-blue-glass: rgba(26,58,74,0.03);
  --success: #17a34a; --warn: #c17f3b; --danger: #dc2626;
  --border: #e2e6ea; --border-soft: #eceff3;
  --glass-bg: rgba(255,255,255,0.72);
  --glass-border: rgba(255,255,255,0.35);
  --glass-shadow: 0 8px 32px rgba(26,58,74,0.08);
  --glass-shadow-strong: 0 12px 48px rgba(26,58,74,0.12);
  --font-display: 'DM Sans','Noto Sans SC',-apple-system,system-ui,sans-serif;
  --font-body: 'EB Garamond','Noto Serif SC',Georgia,serif;
  --font-mono: 'JetBrains Mono',ui-monospace,monospace;
  --font-system: -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --text-xs: 12px; --text-sm: 14px; --text-base: 16px;
  --text-lg: 20px; --text-xl: 24px; --text-2xl: 32px; --text-3xl: 48px; --text-4xl: 64px;
  --slide-label: clamp(11px,0.7vw,15px);
  --slide-title: clamp(24px,2.8vw,48px);
  --slide-subtitle: clamp(14px,1.0vw,20px);
  --slide-body: clamp(13px,0.85vw,17px);
  --slide-caption: clamp(10px,0.6vw,13px);
  --leading-body: 1.55; --leading-tight: 1.15; --tracking-display: -0.015em;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;--space-12:48px;--space-20:80px;
  --radius-sm:6px;--radius-md:10px;--radius-lg:16px;--radius-pill:9999px;
  --elev-flat:none;--elev-ring:0 0 0 1px var(--border);--elev-raised:0 2px 8px rgba(26,58,74,0.08);
  --focus-ring: 0 0 0 3px color-mix(in oklab,var(--accent),transparent 70%);
  --motion-fast:150ms;--motion-base:250ms;
  --ease-standard:cubic-bezier(0.2,0,0,1);--ease-emphasis:cubic-bezier(0.22,1,0.36,1);
  --header-h:9%;--footer-h:6.5%;--slide-inset-top:9.5%;--slide-inset-bot:7.5%;--slide-inset-horiz:4.2%;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:var(--font-body);font-size:var(--text-base);line-height:var(--leading-body);color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button{font:inherit;cursor:pointer;border:none;background:none}
img{display:block;max-width:100%}ul{list-style:none}svg{overflow:visible}
.deck{position:relative;width:min(100vw,177.78vh);height:min(100vh,56.25vw);min-width:320px;min-height:180px;margin:0 auto;overflow:hidden;background:var(--surface);box-shadow:0 0 80px rgba(26,58,74,0.06)}
body{display:grid;place-items:center;background:var(--bg)}
.deck::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--fg),var(--accent),var(--highlight));z-index:100}
.deck-header{position:absolute;top:0;left:var(--slide-inset-horiz);right:var(--slide-inset-horiz);height:var(--header-h);display:flex;align-items:center;gap:var(--space-4);z-index:20;border-bottom:1px solid var(--border-soft)}
.deck-header__brand{width:clamp(28px,2.6vw,44px);aspect-ratio:1;display:grid;place-items:center;border-radius:var(--radius-sm);background:var(--accent);color:var(--accent-on);font-family:var(--font-display);font-size:clamp(10px,0.7vw,14px);font-weight:700}
.deck-header__info{flex:1;min-width:0}
.deck-header__kicker{margin-bottom:1px;font-family:var(--font-system);font-size:var(--slide-label);font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--accent)}
.deck-header__title{font-family:var(--font-display);font-size:clamp(11px,1.0vw,18px);font-weight:600;color:var(--fg);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:var(--tracking-display)}
.deck-header__section{font-family:var(--font-system);font-size:var(--slide-label);color:var(--muted);white-space:nowrap;background:var(--deep-blue-soft);padding:4px 12px;border-radius:var(--radius-pill)}
.slide-stage{position:absolute;top:var(--slide-inset-top);left:var(--slide-inset-horiz);right:var(--slide-inset-horiz);bottom:var(--slide-inset-bot);z-index:2}
.slide{position:absolute;inset:0;display:grid;gap:2.5%;align-content:center;opacity:0;transform:translateX(3%) scale(0.99);pointer-events:none;transition:opacity 450ms var(--ease-standard),transform 500ms var(--ease-emphasis);will-change:transform,opacity}
.slide.is-active{opacity:1;transform:translateX(0) scale(1);pointer-events:auto}
.slide.is-exiting-left{opacity:0;transform:translateX(-3%) scale(0.99)}
.slide.is-exiting-right{opacity:0;transform:translateX(3%) scale(0.99)}
.slide-content{position:relative;z-index:3;align-self:center;min-width:0;display:flex;flex-direction:column;gap:var(--space-2)}
.slide-eyebrow{font-family:var(--font-system);font-size:var(--slide-label);font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:var(--space-2)}
.slide-eyebrow::before{content:'';width:20px;height:2px;background:var(--accent);border-radius:1px}
.slide-title{font-family:var(--font-display);font-size:var(--slide-title);font-weight:600;line-height:var(--leading-tight);letter-spacing:var(--tracking-display);color:var(--fg);max-width:14em}
.slide-subtitle{font-family:var(--font-body);font-size:var(--slide-subtitle);font-weight:400;line-height:1.45;color:var(--muted);max-width:38em}
.bullet-list{display:grid;gap:clamp(6px,0.5vw,10px);margin-top:clamp(4px,0.6vw,12px)}
.bullet-list li{position:relative;padding:clamp(6px,0.55vw,10px) clamp(12px,0.9vw,16px) clamp(6px,0.55vw,10px) clamp(28px,2.0vw,38px);font-size:var(--slide-body);line-height:1.45;color:var(--fg);background:var(--deep-blue-glass);border:1px solid var(--border-soft);border-radius:var(--radius-md);overflow-wrap:anywhere}
.bullet-list li::before{position:absolute;top:0.95em;left:clamp(11px,0.85vw,16px);width:7px;height:7px;content:'';background:var(--accent);border-radius:50%;opacity:0.7}
.slide-visual{display:grid;gap:clamp(6px,0.6vw,12px);align-self:stretch;min-width:0;min-height:0}
.slide,.slide[data-layout="image-focus"]{grid-template-columns:minmax(0,0.72fr) minmax(0,1.28fr)}
.slide[data-layout="image-focus"] .slide-visual{grid-template-rows:minmax(0,1fr) minmax(0,auto)}
.slide[data-layout="split-visual"]{grid-template-columns:minmax(0,0.72fr) minmax(0,1.28fr)}
.slide[data-layout="split-visual"] .slide-visual{grid-template-rows:minmax(0,1fr) minmax(0,auto)}
.slide[data-layout="diagram-focus"],.slide[data-layout="hero-mechanism"]{grid-template-columns:minmax(0,0.78fr) minmax(0,1.22fr)}
.slide[data-layout="diagram-focus"] .slide-visual,.slide[data-layout="hero-mechanism"] .slide-visual{grid-template-rows:minmax(0,1fr)}
.slide[data-layout="diagram-focus"] .diagram-card,.slide[data-layout="hero-mechanism"] .diagram-card{min-height:100%}
.slide[data-layout="wide-diagram"]{grid-template-columns:minmax(0,0.64fr) minmax(0,1.36fr)}
.slide[data-layout="wide-diagram"] .slide-visual{grid-template-rows:minmax(0,1fr)}
.slide[data-layout="summary"]{grid-template-columns:minmax(0,0.7fr) minmax(0,1.3fr)}
.slide[data-layout="summary"] .slide-visual{grid-template-rows:minmax(0,1fr)}
.slide[data-layout="protein-focus"]{grid-template-columns:minmax(0,0.6fr) minmax(0,1.4fr)}
.slide[data-layout="protein-focus"] .slide-visual{grid-template-columns:minmax(0,0.85fr) minmax(0,1.15fr);grid-template-rows:minmax(0,1fr) minmax(0,auto)}
.slide[data-layout="protein-focus"] .media-frame{grid-row:1/2;grid-column:1/2}
.slide[data-layout="protein-focus"] .protein-panel{grid-row:1/3;grid-column:2/3;min-height:100%}
.slide[data-layout="protein-focus"] .diagram-card{grid-row:2/3;grid-column:1/2}
.media-frame{display:grid;grid-template-rows:minmax(0,1fr) auto;overflow:hidden;background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-md);box-shadow:var(--glass-shadow)}
.media-frame img{width:100%;height:100%;object-fit:contain;display:block}
.image-caption{padding:clamp(5px,0.45vw,10px) clamp(8px,0.6vw,14px);font-family:var(--font-system);font-size:var(--slide-caption);color:var(--muted);line-height:1.35;background:var(--deep-blue-glass);border-top:1px solid var(--border-soft)}
.diagram-card{position:relative;display:grid;place-items:center;min-height:clamp(140px,20vh,280px);overflow:hidden;background:var(--glass-bg);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--glass-border);border-radius:var(--radius-lg);box-shadow:var(--glass-shadow)}
.diagram-card::before{position:absolute;inset:0;content:'';background:linear-gradient(rgba(26,58,74,0.03)1px,transparent 1px),linear-gradient(90deg,rgba(26,58,74,0.03)1px,transparent 1px);background-size:24px 24px;pointer-events:none;z-index:0}
.diagram-card>*{position:relative;z-index:1}
.mechanism-svg{width:100%;height:auto;min-height:clamp(130px,16vh,220px);padding:2%}
.mechanism-svg-large{min-height:clamp(180px,32vh,400px)}
.mechanism-svg .svg-arrow,.mechanism-svg .summary-link,.mechanism-svg .transfer-bridge,.mechanism-svg .jump-arc,.mechanism-svg .nascent-rna,.mechanism-svg .switch-arrow,.mechanism-svg .crossover,.mechanism-svg .external-dna,.mechanism-svg .peak-curve{fill:none;stroke:var(--fg);stroke-width:2.5;stroke-linecap:round;opacity:0.75}
.mechanism-svg .switch-arrow,.mechanism-svg .effect-line{stroke:var(--accent);stroke-width:3}
.mechanism-svg .jump-arc{stroke-width:3;stroke:var(--accent);stroke-dasharray:6 4}
.mechanism-svg .svg-kicker{fill:var(--accent);font-family:var(--font-system);font-size:13px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;text-anchor:start}
.mechanism-svg text{font-family:var(--font-system);fill:var(--fg);text-anchor:middle}
.mechanism-svg .svg-note,.mechanism-svg .effect-text{font-size:14px;fill:var(--muted);font-weight:500}
.mechanism-svg .effect-text{fill:var(--fg)}
.mechanism-svg .rna-template path,.mechanism-svg .cloud-rna,.mechanism-svg .mini-rna{fill:none;stroke:var(--fg);stroke-width:4;stroke-linecap:round;opacity:0.5}
.mechanism-svg .template-b path,.mechanism-svg .cloud-rna.b,.mechanism-svg .mini-rna.b{stroke:var(--accent);opacity:0.7}
.mechanism-svg .cloud-rna.c{stroke:var(--highlight);opacity:0.5}
.mechanism-svg .base-strip rect,.mechanism-svg .protein-chain rect,.mechanism-svg .function-box rect,.mechanism-svg .lineage rect,.mechanism-svg .epi-grid rect,.mechanism-svg .summary-node rect,.mechanism-svg .template-label rect,.mechanism-svg .factor-list rect,.mechanism-svg .controlled-tags rect,.mechanism-svg .compare-card rect,.mechanism-svg .evo-track rect{fill:var(--deep-blue-soft);stroke:var(--border);stroke-width:1.5}
.mechanism-svg .base-strip .is-hot,.mechanism-svg .protein-chain .is-hot,.mechanism-svg .epi-hot{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.mechanism-svg .rbd-core,.mechanism-svg .selection-core,.mechanism-svg .summary-core,.mechanism-svg .polymerase circle,.mechanism-svg .stat-orbit circle,.mechanism-svg .advantage-node,.mechanism-svg .evo-core{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2.5}
.mechanism-svg .stall-ring{fill:none;stroke:var(--accent-glow);stroke-dasharray:6 6;stroke-width:3}
.mechanism-svg .base-strip text,.mechanism-svg .function-box text,.mechanism-svg .lineage text,.mechanism-svg .epi-grid text,.mechanism-svg .rbd-text,.mechanism-svg .selection-main,.mechanism-svg .bacterium text{fill:var(--fg);font-family:var(--font-system);font-weight:600;text-anchor:middle;font-size:15px}
.mechanism-svg .rbd-text,.mechanism-svg .selection-main,.mechanism-svg .summary-core-title{font-size:20px}
.mechanism-svg .rbd-subtext,.mechanism-svg .selection-sub,.mechanism-svg .summary-core-sub{font-size:13px;fill:var(--muted)}
.mechanism-svg .rbd-surface{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2;opacity:0.6}
.mechanism-svg .mutation-tags text{fill:var(--highlight);font-size:14px;font-weight:600;text-anchor:middle}
.mechanism-svg .antibody{fill:none;stroke:var(--border);stroke-width:6;stroke-linecap:round}
.mechanism-svg .antibody-faded{opacity:0.4}
.mechanism-svg .ace2-block{fill:var(--highlight-soft);stroke:var(--highlight);stroke-width:2}
.mechanism-svg .bacterium ellipse{fill:var(--deep-blue-soft);stroke:var(--border);stroke-width:2}
.mechanism-svg .chromosome,.mechanism-svg .crossover,.mechanism-svg .mini-chromosome{fill:none;stroke-width:8;stroke-linecap:round}
.mechanism-svg .chromosome-blue,.mechanism-svg .mini-chromosome{stroke:var(--fg);opacity:0.5}
.mechanism-svg .chromosome-silver,.mechanism-svg .mini-chromosome.alt{stroke:var(--muted);opacity:0.4}
.mechanism-svg .crossover{stroke:var(--accent);stroke-width:4;opacity:0.7}
.mechanism-svg .host-body,.mechanism-svg .host-head{fill:var(--deep-blue-soft);stroke:var(--border);stroke-width:2}
.mechanism-svg .timeline{stroke:var(--border);stroke-width:2}
.mechanism-svg .time-node circle{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.mechanism-svg .variant-cloud circle{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
.mechanism-svg .plasmid,.mechanism-svg .external-dna{fill:none;stroke:var(--accent);stroke-width:3}

.mechanism-svg .dna-handle{fill:var(--accent);stroke:var(--accent-on);stroke-width:1.5}
.mechanism-svg .conjugation-arrow{stroke:var(--fg);opacity:0.6}

.mechanism-svg .phage-head{fill:var(--deep-blue-soft);stroke:var(--fg);stroke-width:2.5}

.mechanism-svg .phage-sheath{fill:var(--deep-blue-soft)}
.mechanism-svg .phage-dna-injection{fill:none;stroke:var(--accent);stroke-dasharray:6 6;stroke-width:3;stroke-linecap:round;opacity:0}
.mechanism-svg .process-labels text{fill:var(--accent);font-size:15px;font-weight:600;text-anchor:middle}

.mechanism-svg .plasmid-transfer:focus-visible,.mechanism-svg .transformation-dna:focus-visible,.mechanism-svg .phage-transfer:focus-visible{filter:drop-shadow(0 0 8px rgba(58,140,111,0.5))}

.mechanism-svg .stat-label{fill:var(--muted);font-size:12px}
.mechanism-svg .genome-axis rect{fill:var(--deep-blue-soft);stroke:var(--border);stroke-width:1.5}
.mechanism-svg .genome-axis .spike-peak{fill:var(--accent-soft);stroke:var(--accent)}
.mechanism-svg .spread-arrow{stroke:var(--accent)}
.mechanism-svg .template-label{fill:var(--muted);font-size:13px;text-anchor:start;font-weight:500}
.mechanism-svg .switch-label{fill:var(--accent);font-size:13px;font-weight:600}
.mechanism-svg .genome-label{fill:var(--fg);font-size:14px;font-weight:600;text-anchor:end}
.protein-panel{position:relative;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;align-items:stretch;padding:clamp(8px,0.7vw,14px);min-height:100%;background:var(--glass-bg);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--glass-border);border-radius:var(--radius-lg);box-shadow:var(--glass-shadow)}

.nav-btn{display:inline-flex;align-items:center;justify-content:center;min-width:clamp(56px,4.4vw,80px);height:clamp(28px,2.2vw,36px);padding:0 clamp(10px,0.9vw,16px);font-family:var(--font-system);font-size:clamp(11px,0.7vw,13px);font-weight:600;letter-spacing:0.03em;color:var(--accent-on);background:var(--fg);border:none;border-radius:var(--radius-pill);transition:background var(--motion-fast) var(--ease-standard),transform var(--motion-fast) var(--ease-standard),box-shadow var(--motion-fast) var(--ease-standard)}

  if(deckSection)deckSection.textContent=st.currentIndex<7?'Point Mutation':'Recombination';
}
function getHash(){var m=location.hash.match(/slide-(\d+)/i);if(!m)return 0;var i=Number(m[1])-1;return Number.isNaN(i)?0:Math.min(Math.max(i,0),Math.max(st.slides.length-1,0))}
document.addEventListener('DOMContentLoaded',function(){try{init()}catch(e){var m=e&&e.message?en(e.message):'unknown';stage.innerHTML='<section class="slide is-active slide--error" data-layout="summary"><div class="slide-content"><p class="slide-eyebrow">Data Error</p><h2 class="slide-title">加载失败</h2><p class="slide-subtitle">'+m+'</p><p class="slide-subtitle" style="font:12px/1.4 monospace;color:var(--meta);margin-top:1em">'+en(e&&e.stack?e.stack.split('\n')[0]:'—')+'</p></div></section>';console.error('init error',e)}});
</script>
