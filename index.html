<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SARS-CoV-2 分子进化</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="style.css" rel="stylesheet" />
</head>
<body>
  <div class="deck" role="application" aria-label="SARS-CoV-2 分子进化演示">
    <header class="deck-header" aria-label="演示页眉">
      <div class="deck-header__brand" aria-hidden="true">ME</div>
      <div class="deck-header__info">
        <p class="deck-header__kicker">Microbiology Presentation</p>
        <h1 id="deck-title" class="deck-header__title">SARS-CoV-2 分子进化</h1>
      </div>
      <span id="deck-section" class="deck-header__section">封面</span>
    </header>
    <main id="slide-stage" class="slide-stage" aria-live="polite"></main>
    <footer class="deck-footer" aria-label="演示页脚">
      <div class="deck-footer__left"><span id="slide-counter" class="deck-counter">01 / 22</span></div>
    </footer>
    <nav class="deck-nav" aria-label="幻灯片导航">
      <button id="prev-btn" class="nav-btn nav-btn--prev" type="button" aria-label="上一页" disabled>← Prev</button>
      <button id="next-btn" class="nav-btn" type="button" aria-label="下一页">Next →</button>
    </nav>
  </div>
  <script src="script.js"></script>
</body>
</html>
